; Generated by FreezeFrame (ue/project_template). gtb.py rewrites it when the template changes.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Engine.GameModeBase

[/Script/Engine.RendererSettings]
; Everything is lit dynamically, like the Blender scene (no lightmaps to bake).
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
r.SkinCache.CompileShaders=True
; Exposure and tonemapping come from look.json through GTB's post-process LUT.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4
r.Substrate=False
r.SupportSkyAtmosphere=True
r.CustomDepth=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[SystemSettings]
; Finer LUT for the (neutral) tonemapper pass that follows GTB's colour pass.
r.LUT.Size=64
; Niagara Fluids smoke (Heterogeneous Volumes). Without indirect lighting the smoke only
; sees the sun and is black wherever it shadows itself; at 0.35 the billows still shade (the
; generator plume was tuned with it). Overlapping volumes composite
; correctly instead of swapping draw order from frame to frame.
r.HeterogeneousVolumes.IndirectLighting=0.35
r.HeterogeneousVolumes.IndirectLighting.Mode=2
r.HeterogeneousVolumes.SupportOverlappingVolumes=1

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; python -m ue.remote / ue.live edit the open editor.
bRemoteExecution=True
